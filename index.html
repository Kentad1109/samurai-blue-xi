<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#04081f" />
<title>SAMURAI BLUE — スタメンビルダー 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #04081f;
    --bg-1: #08123a;
    --bg-2: #0c1a5a;
    --blue-deep: #001a73;
    --blue-mid: #1948d1;
    --blue-bright: #2e7bff;
    --blue-light: #6ea6ff;
    --blue-glow: #4e9bff;
    --white: #ffffff;
    --off: #e8efff;
    --muted: #8aa1d6;
    --accent: #ff2d4a;
    --gold: #ffd84a;
    --green-mint: #46e0b6;
    --grass-0: #0b3e25;
    --grass-1: #115232;
    --grass-2: #166940;
    --line: rgba(255,255,255,0.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-0);
    color: var(--off);
    font-family: 'Noto Sans JP', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
    overscroll-behavior: none;
  }
  body {
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(46,123,255,0.25), transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(255,45,74,0.10), transparent 60%),
      linear-gradient(180deg, #050b27 0%, #03061b 60%, #020514 100%);
  }
  body.is-dragging-body {
    cursor: grabbing !important;
    user-select: none;
  }
  .bg {
    position: fixed; inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(110,166,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110,166,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 35%, black, transparent 70%);
    z-index: 0;
  }
  .app {
    position: relative;
    z-index: 1;
    max-width: 1480px;
    margin: 0 auto;
    padding: 18px 20px 80px;
  }

  /* ===================== Header ===================== */
  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px;
    padding: 6px 0 18px;
    border-bottom: 1px solid rgba(110,166,255,0.18);
  }
  .hdr-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
  .hdr-mark {
    flex-shrink: 0;
    width: 52px; height: 52px;
    position: relative;
    background: linear-gradient(135deg, #ffffff 0%, #e6efff 100%);
    border-radius: 12px;
    display: grid; place-items: center;
    box-shadow: 0 8px 30px rgba(46,123,255,0.4), inset 0 -3px 8px rgba(0,30,120,0.15);
  }
  .hdr-mark-circle {
    width: 22px; height: 22px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 16px rgba(255,45,74,0.7);
  }
  .hdr-mark-line {
    position: absolute; left: 8px; right: 8px; bottom: 5px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--blue-bright), transparent);
    border-radius: 2px;
  }
  .hdr-titles { min-width: 0; }
  .hdr-eyebrow {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--blue-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hdr-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    margin-top: 5px;
    display: flex; align-items: baseline; gap: 14px;
    letter-spacing: 0.03em;
    color: var(--white);
  }
  .hdr-title-blue {
    color: var(--blue-bright);
    text-shadow: 0 0 14px rgba(46,123,255,0.4);
  }
  .hdr-title-jp {
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--off);
    margin-top: 7px;
    letter-spacing: 0.06em;
  }
  .hdr-title-jp em { color: var(--blue-light); font-style: normal; font-weight: 500; padding: 0 2px; }

  .hdr-counter {
    flex-shrink: 0;
    text-align: right;
    background: linear-gradient(180deg, rgba(46,123,255,0.10), rgba(46,123,255,0.02));
    border: 1px solid rgba(110,166,255,0.25);
    padding: 8px 16px 10px;
    border-radius: 12px;
    min-width: 130px;
  }
  .hdr-counter-num {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    color: var(--white);
    display: flex; justify-content: flex-end; align-items: baseline;
    letter-spacing: 0.03em;
  }
  .hdr-counter-num .glow { color: var(--blue-bright); text-shadow: 0 0 22px rgba(46,123,255,0.8); }
  .hdr-counter-divider { color: var(--muted); margin: 0 4px; font-size: 22px; }
  .hdr-counter-label {
    font-family: 'Oswald', sans-serif;
    font-size: 10px; letter-spacing: 0.22em;
    color: var(--blue-light); margin-top: 4px; text-transform: uppercase;
  }

  /* ===================== Formation Bar ===================== */
  .formations {
    display: flex; flex-direction: column;
    gap: 10px;
    padding: 16px 0 4px;
  }
  .formations-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .formations-label {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Oswald', sans-serif;
    color: var(--blue-light); text-transform: uppercase;
  }
  .formations-label-en { font-size: 12px; letter-spacing: 0.22em; font-weight: 600; }
  .formations-label-jp { font-size: 11px; color: var(--muted); font-family: 'Noto Sans JP'; letter-spacing: 0.08em; text-transform: none; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--blue-bright);
    box-shadow: 0 0 12px var(--blue-bright);
  }
  .dot-red { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .formations-list {
    display: flex; gap: 6px;
    flex-wrap: wrap;
  }
  .formation-chip {
    flex-shrink: 0;
    background: rgba(8,18,58,0.6);
    border: 1px solid rgba(110,166,255,0.18);
    border-radius: 10px;
    padding: 8px 14px;
    color: var(--off);
    cursor: pointer;
    text-align: left;
    transition: all 0.18s ease;
    display: flex; flex-direction: column;
    min-width: 72px;
    white-space: nowrap;
    min-height: 44px;
    justify-content: center;
  }
  .formation-chip:hover {
    border-color: rgba(110,166,255,0.5);
    background: rgba(25,72,209,0.25);
    transform: translateY(-2px);
  }
  .formation-chip.active {
    background: linear-gradient(135deg, var(--blue-bright) 0%, var(--blue-mid) 100%);
    border-color: var(--blue-light);
    color: var(--white);
    box-shadow: 0 8px 24px rgba(46,123,255,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .formation-chip-label {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.06em;
    line-height: 1;
    white-space: nowrap;
  }
  .formation-chip-tag {
    font-size: 10px;
    margin-top: 4px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .formation-chip.active .formation-chip-tag { color: rgba(255,255,255,0.85); }
  .formations-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .ghost-btn {
    background: transparent;
    border: 1px solid rgba(110,166,255,0.3);
    color: var(--off);
    padding: 10px 14px;
    border-radius: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.15s ease;
    font-weight: 600;
    min-height: 44px;
  }
  .ghost-btn:active { transform: scale(0.96); }
  .ghost-btn:hover { background: rgba(46,123,255,0.15); border-color: var(--blue-bright); color: var(--white); }
  .btn-ic { display:flex;align-items:center;justify-content:center;width:14px;height:14px; }

  /* ===================== Main layout ===================== */
  .main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 20px;
    margin-top: 2px;
  }
  .pitch-col {
    display: block;
    align-self: start;
    min-width: 0;
  }
  .pitch-progress {
    display: flex; align-items: center; gap: 12px;
    padding: 0 4px;
    margin-top: 10px;
  }
  .pitch-progress-bar {
    flex: 1; height: 5px;
    background: rgba(110,166,255,0.12);
    border-radius: 4px; overflow: hidden;
  }
  .pitch-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue-bright), var(--accent));
    border-radius: 4px;
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 8px var(--blue-bright);
  }
  .pitch-progress-count {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 13px;
    color: var(--white); min-width: 32px; text-align: right;
  }

  /* ===================== Pitch ===================== */
  .pitch-wrap {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(110,166,255,0.25);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .pitch-grass {
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 36px, rgba(0,0,0,0.08) 36px, rgba(0,0,0,0.08) 72px),
      radial-gradient(ellipse at 50% 30%, #1a7a4a 0%, var(--grass-1) 50%, var(--grass-0) 100%);
  }
  .pitch-blueprint {
    background:
      linear-gradient(rgba(110,166,255,0.07) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, rgba(110,166,255,0.07) 1px, transparent 1px) 0 0/24px 24px,
      radial-gradient(ellipse at 50% 30%, #173a96 0%, #0a1f5b 50%, #061447 100%);
  }
  .pitch-night {
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 36px, rgba(255,255,255,0.025) 36px, rgba(255,255,255,0.025) 72px),
      radial-gradient(ellipse at 50% 30%, #143a26 0%, #082015 50%, #03100a 100%);
  }
  .pitch-inner {
    position: relative;
    aspect-ratio: 2 / 3;
    width: 100%;
  }
  .pitch-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .formations-list-wrap {
    position: relative;
  }
  .tap-hint {
    display: block;
    text-align: right;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgba(110,166,255,0.45);
    padding: 4px 12px 2px;
    pointer-events: none;
  }

  /* ===================== Slots ===================== */
  .slot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 110px; height: 110px;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .slot.drop-hover { z-index: 10; }
  .slot.drop-hover .slot-ring {
    border-color: var(--white);
    background: rgba(255,255,255,0.32);
    transform: translate(-50%, -50%) scale(1.18);
  }
  .slot-empty {
    width: 100%; height: 100%;
    display: grid; place-items: center;
    position: relative;
    pointer-events: none;
  }
  .slot-ring {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.32);
    background: rgba(0,0,0,0.18);
    backdrop-filter: blur(2px);
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    transition: all 0.18s ease;
    animation: idle-pulse 2.4s ease-in-out infinite;
  }
  @keyframes idle-pulse {
    0%, 100% { opacity: 0.6; border-color: rgba(255,255,255,0.35); box-shadow: none; }
    50% { opacity: 1; border-color: rgba(110,166,255,0.9); box-shadow: 0 0 10px 2px rgba(110,166,255,0.3); }
  }
  .slot-label {
    position: relative;
    z-index: 2;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.14em;
    font-weight: 600;
  }
  .slot.is-hinted .slot-ring {
    border-color: var(--blue-light);
    background: rgba(46,123,255,0.22);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(110,166,255,0.5); }
    50% { box-shadow: 0 0 0 14px rgba(110,166,255,0); }
  }

  /* ===================== Player Chip — pitch ===================== */
  .chip {
    user-select: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    touch-action: none;
  }
  .chip.is-dragging { opacity: 0.25; }
  .chip.is-dimmed { opacity: 0.5; }

  .chip-pitch {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    width: 96px;
    position: relative;
    cursor: grab;
  }
  .chip-pitch:active { cursor: grabbing; transform: scale(0.97); }
  .chip-pitch:hover { transform: translateY(-2px); }
  .uniform-img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    pointer-events: none;
    user-select: none;
  }
  .chip-pitch .chip-jersey {
    width: 50px; height: 50px;
    border-radius: 50%;
    display: grid; place-items: center;
    overflow: hidden;
    box-shadow: 0 8px 22px rgba(0,0,0,0.55);
    position: relative;
    transition: all 0.18s ease;
  }
  .chip-mark {
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 900;
    font-size: 22px;
    line-height: 1;
    color: var(--white);
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .chip-pitch .chip-mark { font-size: 22px; }
  .chip-pitch.is-captain .chip-jersey {
    box-shadow: 0 8px 22px rgba(255,216,74,0.45), 0 0 0 2px rgba(255,216,74,0.7);
  }
  .chip-pitch.is-selected .chip-jersey {
    box-shadow: 0 0 0 4px var(--accent), 0 8px 22px rgba(255,45,74,0.5), inset 0 -3px 8px rgba(0,30,120,0.4);
    animation: select-pulse 1s ease-in-out infinite alternate;
  }
  @keyframes select-pulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }
  .chip-c {
    position: absolute;
    top: -5px; right: -5px;
    width: 17px; height: 17px;
    background: var(--gold);
    color: #1a1505;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 10px;
    border-radius: 50%;
    display: grid; place-items: center;
    box-shadow: 0 2px 8px rgba(255,216,74,0.5);
  }
  .chip-pitch .chip-meta {
    text-align: center;
    background: rgba(0,8,40,0.88);
    padding: 3px 8px;
    border-radius: 6px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.12);
    min-width: 64px;
    max-width: 110px;
  }
  .chip-pitch .chip-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--white);
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .chip-pitch .chip-roman {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--blue-light);
    letter-spacing: 0.05em;
    margin-top: 1px;
  }

  /* ===================== Bench panel ===================== */
  .bench {
    background: linear-gradient(180deg, rgba(8,18,58,0.55) 0%, rgba(4,8,31,0.7) 100%);
    border: 1px solid rgba(110,166,255,0.18);
    border-radius: 20px;
    padding: 16px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    position: sticky;
    top: 12px;
    align-self: start;
    touch-action: auto;
  }
  .bench::-webkit-scrollbar { width: 6px; }
  .bench::-webkit-scrollbar-thumb { background: rgba(110,166,255,0.25); border-radius: 4px; }
  .bench.drop-hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,45,74,0.18);
  }
  .bench-hdr {
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(110,166,255,0.12);
  }
  .bench-hdr-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .bench-hdr-label {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--off);
    font-weight: 600;
  }
  .bench-hdr-count {
    font-family: 'JetBrains Mono', monospace;
    margin-left: 4px;
    color: var(--blue-light);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .bench-hdr-hint {
    font-size: 10px;
    color: var(--muted);
  }
  .hint-mob { display: none; }
  .hint-desk { display: inline; }

  /* Filter tabs */
  .filter-tabs {
    display: flex; gap: 4px;
    background: rgba(0,0,0,0.25);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid rgba(110,166,255,0.12);
  }
  .filter-tab {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 7px 6px;
    border-radius: 7px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    min-height: 36px;
  }
  .filter-tab:hover { color: var(--off); background: rgba(255,255,255,0.04); }
  .filter-tab.active {
    background: linear-gradient(180deg, rgba(46,123,255,0.35), rgba(25,72,209,0.25));
    color: var(--white);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .filter-tab.active.filter-GK { background: linear-gradient(180deg, rgba(255,216,74,0.3), rgba(255,216,74,0.1)); }
  .filter-tab.active.filter-DF { background: linear-gradient(180deg, rgba(46,123,255,0.3), rgba(25,72,209,0.15)); }
  .filter-tab.active.filter-MF { background: linear-gradient(180deg, rgba(70,224,182,0.3), rgba(70,224,182,0.1)); }
  .filter-tab.active.filter-FW { background: linear-gradient(180deg, rgba(255,45,74,0.3), rgba(255,45,74,0.1)); }
  .filter-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    opacity: 0.8;
  }

  .bench-list { display: flex; flex-direction: column; gap: 14px; }
  .bench-group-title {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .role-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 3px 7px;
    border-radius: 5px;
    font-weight: 700;
  }
  .role-GK { background: rgba(255,216,74,0.18); color: var(--gold); border: 1px solid rgba(255,216,74,0.3); }
  .role-DF { background: rgba(110,166,255,0.18); color: var(--blue-light); border: 1px solid rgba(110,166,255,0.3); }
  .role-MF { background: rgba(70,224,182,0.18); color: var(--green-mint); border: 1px solid rgba(70,224,182,0.3); }
  .role-FW { background: rgba(255,45,74,0.18); color: var(--accent); border: 1px solid rgba(255,45,74,0.3); }
  .bench-group-name {
    font-size: 11px;
    color: var(--muted);
    flex: 1;
  }
  .bench-group-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--blue-light);
  }
  .bench-group-chips { display: flex; flex-direction: column; gap: 6px; }
  .bench-empty {
    font-size: 11px;
    color: var(--muted);
    padding: 8px;
    text-align: center;
    border: 1px dashed rgba(110,166,255,0.2);
    border-radius: 6px;
    font-style: italic;
  }

  /* ===================== Bench Chip ===================== */
  .chip-bench {
    display: flex; align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, rgba(25,72,209,0.18) 0%, rgba(8,18,58,0.4) 100%);
    border: 1px solid rgba(110,166,255,0.18);
    border-radius: 10px;
    padding: 8px 10px;
    position: relative;
    overflow: hidden;
    cursor: grab;
    min-height: 56px;
  }
  .chip-bench:active { cursor: grabbing; }
  .chip-bench:hover {
    border-color: var(--blue-bright);
    background: linear-gradient(135deg, rgba(46,123,255,0.25) 0%, rgba(25,72,209,0.15) 100%);
    transform: translateX(3px);
    box-shadow: -3px 0 0 0 var(--blue-bright);
  }
  .chip-bench.is-selected {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(255,45,74,0.18) 0%, rgba(255,45,74,0.04) 100%);
    box-shadow: -4px 0 0 0 var(--accent), 0 6px 20px rgba(255,45,74,0.25);
    transform: translateX(4px);
  }
  .chip-bench .chip-jersey {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 50%;
    display: grid; place-items: center;
    overflow: hidden;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .chip-bench .chip-mark { font-size: 17px; }
  .chip-bench.is-captain .chip-jersey { box-shadow: 0 0 0 2px var(--gold); }
  .chip-bench .chip-c {
    width: 14px; height: 14px;
    font-size: 8px;
    top: -3px; right: -3px;
  }
  .chip-bench .chip-meta { flex: 1; min-width: 0; }
  .chip-bench .chip-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip-bench .chip-roman {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--blue-light);
    margin-top: 1px;
    letter-spacing: 0.04em;
  }
  .chip-bench .chip-club {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip-bench .chip-pos-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    letter-spacing: 0.1em;
    padding: 2px 6px;
    border-radius: 4px;
    align-self: flex-start;
    flex-shrink: 0;
  }

  /* ===================== Drag Ghost ===================== */
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 1500;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    animation: ghost-in 0.12s ease;
  }
  @keyframes ghost-in {
    from { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }
  .ghost-jersey {
    width: 60px; height: 60px;
    border-radius: 50%;
    display: grid; place-items: center;
    overflow: hidden;
    position: relative;
    box-shadow: 0 14px 35px rgba(0,0,0,0.6), 0 0 30px rgba(46,123,255,0.5);
  }
  .drag-ghost.is-captain .ghost-jersey {
    box-shadow: 0 14px 35px rgba(255,216,74,0.4), 0 0 0 2px var(--gold);
  }
  .ghost-name {
    background: rgba(0,8,40,0.9);
    color: var(--white);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.2);
    white-space: nowrap;
  }

  /* ===================== Footer ===================== */
  .ftr {
    margin-top: 16px;
    padding: 14px 18px;
    background: linear-gradient(180deg, rgba(8,18,58,0.5), rgba(4,8,31,0.3));
    border: 1px solid rgba(110,166,255,0.15);
    border-radius: 14px;
  }
  .ftr-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
  }
  .ftr-formation { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .ftr-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--blue-light);
  }
  .ftr-value {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    color: var(--white);
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .ftr-tag { font-size: 12px; color: var(--muted); }
  .ftr-progress { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 220px; max-width: 420px; justify-content: flex-end; flex-wrap: wrap; }
  .ftr-selected {
    background: rgba(255,45,74,0.14);
    border: 1px solid rgba(255,45,74,0.3);
    color: var(--off);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    display: flex; align-items: center; gap: 8px;
    width: 100%;
  }
  .ftr-selected b { color: var(--white); }
  .ftr-selected-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: select-pulse 1s ease-in-out infinite alternate;
  }
  .ftr-bar {
    flex: 1;
    height: 6px;
    background: rgba(110,166,255,0.12);
    border-radius: 4px;
    overflow: hidden;
    min-width: 100px;
  }
  .ftr-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue-bright), var(--accent));
    border-radius: 4px;
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 10px var(--blue-bright);
  }
  .ftr-pct {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--white);
    min-width: 50px;
    text-align: right;
  }

  /* ===================== Toast ===================== */
  .toast {
    position: fixed;
    top: 70px; left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    background: linear-gradient(135deg, var(--blue-bright), var(--accent));
    color: var(--white);
    padding: 12px 24px;
    border-radius: 999px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    box-shadow: 0 20px 60px rgba(46,123,255,0.45);
    animation: toastIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes toastIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.7); }
    60% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.05); }
    100% { transform: translateX(-50%) translateY(0) scale(1); }
  }
  .toast-burst {
    position: absolute; inset: -4px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.6);
    animation: burst 0.8s ease-out;
  }
  @keyframes burst {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.4); }
  }

  /* ===================== Slot Picker Modal ===================== */
  .picker-overlay {
    position: fixed; inset: 0; z-index: 800;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .picker-sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, #0d1e5a 0%, #060f2e 100%);
    border: 1px solid rgba(110,166,255,0.2);
    border-bottom: none;
    border-radius: 22px 22px 0 0;
    max-height: 72vh;
    display: flex; flex-direction: column;
    animation: pickerSlideUp .28s cubic-bezier(.22,1,.36,1);
  }
  @keyframes pickerSlideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .picker-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,.2);
    border-radius: 2px;
    margin: 10px auto 0;
    flex-shrink: 0;
  }
  .picker-hdr {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px 12px;
    border-bottom: 1px solid rgba(110,166,255,0.12);
    flex-shrink: 0;
  }
  .picker-hdr-info { flex: 1; display: flex; align-items: center; gap: 8px; }
  .picker-hdr-label {
    font-family: 'Oswald', sans-serif;
    font-size: 15px; font-weight: 700;
    color: var(--white); letter-spacing: 0.04em;
  }
  .picker-remove {
    appearance: none;
    border: 1px solid rgba(255,45,74,.4);
    background: rgba(255,45,74,.1); color: var(--accent);
    padding: 6px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    white-space: nowrap;
  }
  .picker-remove:hover { background: rgba(255,45,74,.22); }
  .picker-close {
    appearance: none; border: 0;
    background: rgba(255,255,255,.08); color: var(--off);
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 13px; cursor: pointer;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .picker-close:hover { background: rgba(255,255,255,.18); }
  .picker-list {
    overflow-y: auto; flex: 1;
    padding: 8px 14px 32px;
    display: flex; flex-direction: column; gap: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .picker-section-label {
    font-family: 'Oswald', sans-serif;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); padding: 10px 0 4px;
  }
  .picker-player {
    display: flex; align-items: center; gap: 12px;
    width: 100%; appearance: none;
    border: 1px solid rgba(110,166,255,.15);
    background: rgba(25,72,209,.12);
    border-radius: 12px; padding: 10px 12px;
    cursor: pointer; text-align: left;
    transition: background .12s, border-color .12s, transform .1s;
    touch-action: manipulation;
  }
  .picker-player:active {
    background: rgba(46,123,255,.3);
    border-color: rgba(110,166,255,.5);
    transform: scale(0.98);
  }
  .picker-player.picker-placed {
    opacity: 0.6;
    border-style: dashed;
  }
  .picker-player-icon {
    width: 44px; height: 44px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
  }
  .picker-player-info { flex: 1; min-width: 0; }
  .picker-player-name {
    font-size: 14px; font-weight: 700;
    color: var(--white); display: block; line-height: 1.2;
  }
  .picker-player-club {
    font-size: 11px; color: var(--muted);
    display: block; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* =======================================================
     ============== DESKTOP (>= 861px) =====================
     ======================================================= */
  @media (min-width: 861px) {
    .pitch-col {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 300px);
    }
    .pitch-wrap {
      flex: 1;
      min-height: 0;
      overflow: visible;
    }
    .pitch-inner {
      height: 100%;
      width: auto;
      aspect-ratio: 2 / 3;
      margin: 0 auto;
    }
  }

  /* =======================================================
     ============== MOBILE (<= 860px) =====================
     ======================================================= */
  @media (max-width: 860px) {
    .app { padding: 12px 12px 24px; }

    /* Header: compact, JP subtitle hidden */
    .hdr { padding: 4px 0 14px; gap: 10px; }
    .hdr-mark { width: 44px; height: 44px; border-radius: 10px; }
    .hdr-mark-circle { width: 18px; height: 18px; }
    .hdr-eyebrow { font-size: 9.5px; }
    .hdr-title { font-size: 26px; gap: 10px; margin-top: 4px; }
    .hdr-title-jp { display: none; }
    .hdr-counter { padding: 6px 12px 8px; min-width: 96px; }
    .hdr-counter-num { font-size: 24px; }
    .hdr-counter-divider { font-size: 18px; }
    .hdr-counter-label { font-size: 9px; }

    /* Formation bar: horizontal scroll */
    .formations { padding: 10px 0; gap: 8px; }
    .formations-top { gap: 8px; }
    .formations-label-jp { display: none; }
    .formations-list {
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
    }
    .formations-list::-webkit-scrollbar { display: none; }
    .formation-chip {
      scroll-snap-align: start;
      min-width: 80px;
      padding: 8px 12px;
    }
    .ghost-btn { padding: 6px 8px; font-size: 9.5px; flex-direction: column; gap: 3px; min-height: 44px; letter-spacing: 0.04em; }
    .ghost-btn .btn-ic { width: 16px; height: 16px; }
    .ghost-btn .btn-ic svg { width: 15px; height: 15px; }

    /* Main: stacked */
    .main {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .pitch-progress { padding: 0 2px; }
    .pitch-progress-bar { height: 4px; }

    /* Pitch sized on mobile */
    .pitch-inner { aspect-ratio: 1 / 1.45; }
    .slot { width: 84px; height: 84px; }
    .slot-ring { width: 52px; height: 52px; }
    .slot-label { font-size: 10px; }
    .chip-pitch { width: 84px; }
    .chip-pitch .chip-jersey { width: 46px; height: 46px; font-size: 18px; border-width: 1.5px; }
    .chip-pitch .chip-meta { padding: 2px 5px; min-width: 50px; max-width: 86px; }
    .chip-pitch .chip-name { font-size: 9.5px; }
    .chip-pitch .chip-roman { font-size: 7px; }
    .chip-c { width: 14px; height: 14px; font-size: 8px; top: -3px; right: -3px; }

    /* Bench: not sticky on mobile, full width, horizontal chip groups */
    .bench {
      position: relative;
      top: 0;
      max-height: none;
      padding: 12px;
      border-radius: 16px;
    }
    .bench-hdr-row { gap: 6px; margin-bottom: 8px; }
    .hint-mob { display: inline; }
    .hint-desk { display: none; }
    .bench-hdr-hint { font-size: 9.5px; }

    .filter-tab { font-size: 10px; padding: 8px 4px; }

    .bench-list { gap: 10px; }
    .bench-group-title { margin-bottom: 6px; }
    .bench-group-name { font-size: 10px; }

    /* Horizontal scrolling chip row per group */
    .bench-group-chips {
      flex-direction: row;
      overflow-x: auto;
      gap: 8px;
      padding: 2px 0 6px;
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }
    .bench-group-chips::-webkit-scrollbar { display: none; }
    .bench-group-chips .chip { touch-action: pan-x; }

    /* Compact card-style bench chip on mobile */
    .chip-bench {
      flex-shrink: 0;
      width: 116px;
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      gap: 6px;
      padding: 10px 8px;
      min-height: 110px;
      scroll-snap-align: start;
    }
    .chip-bench:hover { transform: none; box-shadow: none; }
    .chip-bench.is-selected {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255,45,74,0.35), 0 0 0 2px var(--accent);
    }
    .chip-bench .chip-jersey {
      width: 44px; height: 44px;
      font-size: 18px;
      margin: 0 auto;
    }
    .chip-bench .chip-meta { text-align: center; }
    .chip-bench .chip-name { font-size: 12px; white-space: normal; line-height: 1.15; }
    .chip-bench .chip-club { font-size: 9px; }
    .chip-bench .chip-pos-tag {
      align-self: center;
      font-size: 8.5px;
      padding: 1px 5px;
    }

    /* Footer */
    .ftr { padding: 10px 14px; margin-top: 12px; }
    .ftr-value { font-size: 18px; }
    .ftr-tag { font-size: 11px; }
    .ftr-selected { font-size: 11px; }

    .toast { font-size: 14px; padding: 10px 18px; top: 60px; }
    .drag-ghost .ghost-jersey { width: 52px; height: 52px; font-size: 20px; }

    /* Disable hover transforms for touch */
    @media (hover: none) {
      .chip-pitch:hover, .chip-bench:hover, .formation-chip:hover, .ghost-btn:hover, .filter-tab:hover {
        transform: none;
      }
    }
  }

  /* ===== Placed player chips in bench ===== */
  /* Desktop: hide placed chips and empty groups */
  @media (min-width: 861px) {
    .chip-bench.is-placed { display: none; }
    .chip-placed-badge { display: none; }
    .bench-group:not(:has(.chip-bench:not(.is-placed))) { display: none; }
  }
  /* Mobile: show placed chips dimmed with badge */
  @media (max-width: 860px) {
    .chip-bench.is-placed {
      opacity: 0.42;
      border-color: rgba(70,224,182,0.35);
      pointer-events: none;
    }
    .chip-placed-badge {
      position: absolute;
      top: 4px; left: 50%; transform: translateX(-50%);
      background: rgba(70,224,182,0.2);
      color: #46e0b6;
      font-size: 8px; font-weight: 700;
      padding: 1px 6px; border-radius: 4px;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }
  }

  /* Very small screens */
  @media (max-width: 380px) {
    .hdr-title { font-size: 22px; }
    .hdr-eyebrow { font-size: 9px; letter-spacing: 0.18em; }
    .formation-chip { min-width: 72px; padding: 6px 10px; }
    .formation-chip-label { font-size: 14px; }
    .formation-chip-tag { font-size: 9px; }
    .chip-bench { width: 104px; }
  }
</style>
